<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 190" role="img" aria-labelledby="title"><title id="title">下载一个 HTML → 用浏览器打开 → 导入胶图</title><rect width="944" height="190" rx="16" fill="#f3f6fb"/><g fill="#16202c" font-family="Arial, Microsoft YaHei, sans-serif"><g transform="translate(18 20)"><rect width="286" height="150" rx="14" fill="white" stroke="#dbe3ef"/><circle cx="30" cy="34" r="15" fill="#2f6feb"/><text x="30" y="39" text-anchor="middle" fill="white" font-size="15" font-weight="700">1</text><text x="54" y="41" font-size="20" font-weight="700">下载一个 HTML</text><text x="18" y="84" font-size="15">GelFigure-v版本号.html</text><text x="18" y="116" font-size="13" fill="#5b687a">完整工具 · 约 380 KB</text></g><path d="M 309 94 h 13 m -5 -5 l 5 5 -5 5" stroke="#2f6feb" fill="none" stroke-width="2"/><g transform="translate(328 20)"><rect width="286" height="150" rx="14" fill="white" stroke="#dbe3ef"/><circle cx="30" cy="34" r="15" fill="#2f6feb"/><text x="30" y="39" text-anchor="middle" fill="white" font-size="15" font-weight="700">2</text><text x="54" y="41" font-size="20" font-weight="700">用浏览器打开</text><text x="18" y="84" font-size="15">双击保存到电脑的文件</text><text x="18" y="116" font-size="13" fill="#5b687a">不用安装 · 不用解压</text></g><path d="M 619 94 h 13 m -5 -5 l 5 5 -5 5" stroke="#2f6feb" fill="none" stroke-width="2"/><g transform="translate(638 20)"><rect width="286" height="150" rx="14" fill="white" stroke="#dbe3ef"/><circle cx="30" cy="34" r="15" fill="#2f6feb"/><text x="30" y="39" text-anchor="middle" fill="white" font-size="15" font-weight="700">3</text><text x="54" y="41" font-size="20" font-weight="700">导入胶图</text><text x="18" y="84" font-size="15">核对标注，再导出成图</text><text x="18" y="116" font-size="13" fill="#5b687a">保存 .gelfig，下次接着做</text></g></g></svg>
