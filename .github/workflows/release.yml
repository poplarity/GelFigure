name: Release

# Publish the single HTML for users, plus an optional folder ZIP.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build offline downloads
        run: |
          mkdir -p dist/GelFigure
          cp -r index.html css js test docs LICENSE README.md README.zh-CN.md CHANGELOG.md CONTRIBUTING.md CITATION.cff dist/GelFigure/
          node scripts/bundle-onefile.mjs   # writes dist/GelFigure.html
          node scripts/release-notes.mjs "$GITHUB_REF_NAME"
          cd dist && zip -r "GelFigure-${GITHUB_REF_NAME}.zip" GelFigure
          cp GelFigure.html "GelFigure-${GITHUB_REF_NAME}.html"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/GelFigure-${GITHUB_REF_NAME}.html" "dist/GelFigure-${GITHUB_REF_NAME}.zip" --title "GelFigure $GITHUB_REF_NAME" --notes-file dist/release-notes.md
