name: Release

# push a tag like v0.5.0 to publish a downloadable zip of the app
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir -p dist/GelFigure
          cp -r index.html css js test docs LICENSE README.md README.zh-CN.md CHANGELOG.md CONTRIBUTING.md CITATION.cff dist/GelFigure/
          node scripts/bundle-onefile.mjs   # writes dist/GelFigure.html
          cd dist && zip -r "GelFigure-${GITHUB_REF_NAME}.zip" GelFigure
          cp GelFigure.html "GelFigure-${GITHUB_REF_NAME}.html"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "dist/GelFigure-${GITHUB_REF_NAME}.zip" "dist/GelFigure-${GITHUB_REF_NAME}.html" --title "GelFigure $GITHUB_REF_NAME" --notes "$notes"
